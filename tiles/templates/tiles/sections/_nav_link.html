<a href="/admin/section/{{ s }}/"
   class="nav-item {% if section == s %}active{% endif %} flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-graydark-600 dark:text-graydark-300 hover:bg-brand-50 dark:hover:bg-graydark-800 transition">
  <i class="fa-solid {{ icon }} w-5 text-center"></i>
  <span>{{ label }}</span>
  {% if count is not None %}
  <span class="ml-auto text-[10px] font-semibold px-2 py-0.5 rounded-full {% if section == s %}bg-white/20 text-white{% else %}bg-graydark-100 dark:bg-graydark-800 text-graydark-500 dark:text-graydark-400{% endif %}">{{ count }}</span>
  {% endif %}
</a>
